name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/validate-release.mjs
      - run: node --test
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xchange-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist/xchange-*.zip
          if-no-files-found: error
      - name: Check publishing configuration
        env:
          CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          EXTENSION: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          for name in CREDENTIALS PUBLISHER EXTENSION; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name. Follow docs/releases.md to configure publishing."
              exit 1
            fi
          done
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload and submit for review
        run: node scripts/publish.mjs
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
